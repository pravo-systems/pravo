name: Save the Go build cache
description: >
  Saves the caches that the go action restored, so that the next run starts
  from them: a run restores the newest entry of its key, and a pull request
  falls back to the entries of main. Put it last in a job and give it the key
  that the go action was given.
inputs:
  key:
    description: The key that the go action was given.
    required: true
runs:
  using: composite
  steps:
    - id: dirs
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
    - if: ${{ !cancelled() }}
      uses: actions/cache/save@v6
      with:
        path: |
          ${{ steps.dirs.outputs.build }}
          ${{ steps.dirs.outputs.mod }}
        key: go-${{ runner.os }}-${{ inputs.key }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
