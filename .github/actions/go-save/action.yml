name: Save the Go build cache
description: >
  Saves the caches that the go action restored, so that the next run starts
  from them. Main, the release and a manual run always do. A pull request restores
  the newest entry of its key, or else one of main, and saves only when it found
  none, or when the job took more than a minute after the restore to build what
  the cache lacked: saving takes several seconds of every job, and an entry that
  is too poor would otherwise stay as it is. Put it last in a job, with
  `if: always()` so that a job that ran out of time keeps what it built, and give
  it the key that the go action was given.
inputs:
  key:
    description: The key that the go action was given.
    required: true
  heal:
    description: >
      Whether a pull request saves again when the job had to build for more than a
      minute. Off for the jobs that share a key but compile different packages: the
      entry that one of them saved would stand for all, and a pull request restores
      its own entry before the one of main, which is complete.
    default: "true"
runs:
  using: composite
  steps:
    - id: decide
      shell: bash
      run: |
        command -v go >/dev/null || exit 0
        if [ "${{ github.event_name }}" != pull_request ] || [ -z "${GO_CACHE_MATCHED:-}" ] \
           || { [ "${{ inputs.heal }}" = true ] && [ $(( $(date +%s) - ${GO_CACHE_STARTED:-0} )) -gt 60 ]; }; then
          echo "save=true" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.decide.outputs.save == 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ${{ steps.decide.outputs.build }}
          ${{ steps.decide.outputs.mod }}
        key: go-${{ runner.os }}-${{ inputs.key }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
