name: Save the Go build cache
description: >
  Saves the caches that the go action restored, on main only, so that every
  other run starts from them. Put it last in a job and give it the same key.
inputs:
  key:
    description: The key that the go action was given.
    required: true
runs:
  using: composite
  steps:
    - id: dirs
      if: github.ref == 'refs/heads/main'
      shell: bash
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
    - if: github.ref == 'refs/heads/main'
      uses: actions/cache/save@v6
      with:
        path: |
          ${{ steps.dirs.outputs.build }}
          ${{ steps.dirs.outputs.mod }}
        key: go-${{ runner.os }}-${{ inputs.key }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
