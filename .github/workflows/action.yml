name: Action

# The pravo action (actions/pravo) runs against a pravo built from this commit:
# plan stores a plan, apply applies it by its id, and drift finds nothing.
# Nothing is posted: the comment and the issue are switched off, so the job
# needs no token. The shell script itself is tested in tools/actiontest.
on:
  pull_request:
    paths:
      - actions/pravo/**
      - .github/workflows/action.yml
  push:
    branches: [main]
    paths:
      - actions/pravo/**
      - .github/workflows/action.yml

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: action
      - name: Build pravo and make a root
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/root"
          go build -o "$RUNNER_TEMP/bin/pravo" ./cmd/pravo
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          cat > "$RUNNER_TEMP/root/main.cue" <<'CUE'
          package demo

          import loc "pravo.dev/providers/hashicorp/local"

          $local: loc.#Provider

          hello: $local.#Resource.local_file & {filename: "hello.txt", content: "hello\n"}
          CUE
          pravo -C "$RUNNER_TEMP/root" init
      - id: plan
        uses: ./actions/pravo
        with:
          command: plan
          install: "false"
          working-directory: ${{ runner.temp }}/root
          comment: "false"
      - name: The plan was stored
        run: |
          test "${{ steps.plan.outputs.has-changes }}" = true
          test -n "${{ steps.plan.outputs.plan-id }}"
          grep -q 'create' "${{ steps.plan.outputs.report }}"
      - uses: ./actions/pravo
        with:
          command: apply
          install: "false"
          working-directory: ${{ runner.temp }}/root
          plan-id: ${{ steps.plan.outputs.plan-id }}
      - id: drift
        uses: ./actions/pravo
        with:
          command: drift
          install: "false"
          working-directory: ${{ runner.temp }}/root
          comment: "false"
          fail-on-findings: "true"
      - name: Nothing drifted
        run: test "${{ steps.drift.outputs.exit-code }}" = 0
