name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the same checks before it builds anything.
  workflow_call:

# A new push to a branch cancels the run that is still going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  # The version of OpenTofu that the documentation was written against.
  TOFU_VERSION: 1.13.1

jobs:
  # Which parts of the repository a pull request touches (tools/ci/changes.sh).
  # The jobs that it cannot affect are skipped; main, tags and the workflows
  # themselves run everything. A job of a pull request that takes longer than the
  # limit that it names (three minutes, as a rule) is cancelled: a job that hangs
  # or a cache that is cold should not hold the author for forty minutes.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      all: ${{ steps.c.outputs.all }}
      code: ${{ steps.c.outputs.code }}
      binary: ${{ steps.c.outputs.binary }}
      docs: ${{ steps.c.outputs.docs }}
      site: ${{ steps.c.outputs.site }}
      web: ${{ steps.c.outputs.web }}
      hcl: ${{ steps.c.outputs.hcl }}
      platform: ${{ steps.c.outputs.platform }}
      slow: ${{ steps.c.outputs.slow }}
      limit: ${{ steps.c.outputs.limit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: c
        env:
          CI_EVENT: ${{ github.event_name }}
        run: sh tools/ci/changes.sh
      # Every page of the documentation is in a job of the docs matrix.
      - run: sh tools/ci/pages.sh check

  # Formatting, module hygiene, and a build for every platform that pravo
  # supports (tools/ci/static.sh). Main, the release and a change to CI itself also
  # vet the module on each system, a job for each; a pull request leaves that to
  # golangci-lint on the packages that it changed.
  static:
    name: static (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.changes.outputs.limit) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && needs.changes.outputs.all != 'true' && '[{"name":"formatting, modules and builds","key":"static","run":"sh tools/ci/static.sh format && sh tools/ci/static.sh modules && sh tools/ci/static.sh build"}]' || '[{"name":"formatting, modules and builds","key":"static","run":"sh tools/ci/static.sh format && sh tools/ci/static.sh modules && sh tools/ci/static.sh build"},{"name":"vet for linux","key":"static-vet-linux","run":"sh tools/ci/static.sh vet linux"},{"name":"vet for windows","key":"static-vet-windows","run":"sh tools/ci/static.sh vet windows"},{"name":"vet for macOS","key":"static-vet-darwin","run":"sh tools/ci/static.sh vet darwin"}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: ${{ matrix.key }}
      - run: ${{ matrix.run }}
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: ${{ matrix.key }}

  # golangci-lint (.golangci.yml) on the files of each platform that pravo
  # supports, next to the other jobs and waited for by none of them. The binary,
  # its analysis cache and the build cache are kept between runs, so a run takes
  # about a minute once they are warm.
  lint:
    name: lint (${{ matrix.goos }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.changes.outputs.limit) }}
    strategy:
      fail-fast: false
      matrix:
        # The files of the other systems are linted when a change touches them.
        goos: ${{ fromJSON(needs.changes.outputs.platform == 'true' && '["linux","windows","darwin"]' || '["linux"]') }}
    env:
      # The first release that was built with the Go version of go.mod. Change it
      # together with the line `go` of go.mod when that moves on.
      GOLANGCI_LINT_VERSION: v2.15.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/go
        with:
          key: lint-${{ matrix.goos }}
      - name: Cache golangci-lint
        id: binary
        uses: actions/cache@v6
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('go.mod') }}
      - name: Install golangci-lint
        if: steps.binary.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - name: Cache the analysis
        uses: actions/cache@v6
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-cache-${{ matrix.goos }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: golangci-lint-cache-${{ matrix.goos }}-${{ hashFiles('go.sum', '.golangci.yml') }}-
      - name: golangci-lint
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_ALL: ${{ needs.changes.outputs.all }}
        run: GOOS=${{ matrix.goos }} sh tools/ci/lint.sh ~/go/bin/golangci-lint
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: lint-${{ matrix.goos }}

  # ESLint and Stylelint (tools/_weblint) on the viewer and on the site.
  lint-web:
    name: lint (viewer and site)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.changes.outputs.limit) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/_weblint/package-lock.json
      - run: npm --prefix tools/_weblint ci
      - run: npm --prefix tools/_weblint run lint

  # The Go tests on Linux, split so that the long ones run side by side
  # (tools/ci/shards.txt). A pull request runs only the packages that its change
  # can reach through imports (tools/ci/gotest.sh), without the race detector, and
  # with -short, which keeps the shapes of the stress tests and cuts the number of
  # trials, and leaves out the tests that build the binary or a provider. Main and
  # the release run all of it, with -race.
  test:
    name: test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.changes.outputs.limit) }}
    env:
      CI_EVENT: ${{ github.event_name }}
      CI_ALL: ${{ needs.changes.outputs.all }}
      SHORT: ${{ github.event_name == 'pull_request' && '-short' || '' }}
      RACE: ${{ github.event_name == 'pull_request' && ' ' || '-race' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The engine tests sync many small files, and run faster with the
          # temporary files in memory. Other packages compare paths under the
          # temporary directory and expect the usual one.
          - {name: "engine and viewer", run: "TMPDIR=/dev/shm sh tools/ci/gotest.sh engine $RACE $SHORT && sh tools/ci/gotest.sh serve $SHORT"}
          - {name: "state", run: "sh tools/ci/gotest.sh state $RACE $SHORT"}
          - {name: "cmd: plans", run: "sh tools/ci/gotest.sh cmd shard plans $SHORT"}
          - {name: "cmd: outcomes and policies", run: "sh tools/ci/gotest.sh cmd shard outcomes $SHORT"}
          - {name: "cmd: sealing and recovery", run: "sh tools/ci/gotest.sh cmd shard sealing $SHORT"}
          - {name: "cmd: identities and roles", run: "sh tools/ci/gotest.sh cmd shard identities $SHORT"}
          - {name: "cmd: the other commands", run: "sh tools/ci/gotest.sh cmd shard commands $SHORT"}
          - {name: "other packages", run: "sh tools/ci/gotest.sh other"}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/go
        with:
          key: test
      - run: ${{ matrix.run }}
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: test

  # The same tests on Windows, where file operations and locks behave differently
  # and the runners are slow. A pull request runs them when it changes a file for
  # one system or a package that works with files, locks or processes; main and
  # the release run them always. The build, vet and lint for Windows and macOS
  # are in the jobs above and run every time. The documentation tools run a POSIX
  # shell and are not part of this.
  other-systems:
    name: windows (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.platform == 'true')
    runs-on: windows-latest
    timeout-minutes: ${{ fromJSON(needs.changes.outputs.limit) }}
    env:
      CI_EVENT: ${{ github.event_name }}
      CI_ALL: ${{ needs.changes.outputs.all }}
      SHORT: ${{ github.event_name == 'pull_request' && '-short' || '' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "engine: locks and applies", run: "sh tools/ci/gotest.sh engine in 'applylocks_test.go interrupt_test.go apply_scope_test.go' -v -timeout 25m $SHORT"}
          - {name: "engine: equivalence", run: "sh tools/ci/gotest.sh engine in 'equivalence_test.go' -v -timeout 25m $SHORT"}
          - {name: "engine: plans and discovery", run: "sh tools/ci/gotest.sh engine out 'applylocks_test.go interrupt_test.go apply_scope_test.go equivalence_test.go' -v -timeout 25m $SHORT"}
          - {name: "commands and viewer", run: "sh tools/ci/gotest.sh commands -timeout 25m $SHORT"}
          - {name: "state and libraries", run: "sh tools/ci/gotest.sh libraries -timeout 25m $SHORT"}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/go
        with:
          key: tests
      - run: ${{ matrix.run }}
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: tests

  # The tests of the packages that work with files and locks, on macOS. The
  # runners are scarce: a job has waited five minutes for one. Only main and the
  # release run it.
  macos:
    name: macos (state and cmd)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: ${{ fromJSON(needs.changes.outputs.limit) }}
    env:
      CI_EVENT: ${{ github.event_name }}
      CI_ALL: ${{ needs.changes.outputs.all }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: tests
      - run: sh tools/ci/gotest.sh state && sh tools/ci/gotest.sh cmd
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: tests

  # The tools of the documentation: capture, sitegen, hclcheck and the scale
  # benchmark. Their tests start the binary and some of them run tofu.
  tools:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.changes.outputs.limit) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: tools-tests
      - uses: ./.github/actions/tofu
        timeout-minutes: 3
        with:
          version: ${{ env.TOFU_VERSION }}
      - run: go test -count=1 ./tools/...
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: tools-tests

  # Every command of every page of the documentation runs against the real
  # binary, and its output is compared with the page. The pages are dealt out to
  # jobs by section (tools/ci/pages.sh). A change that leaves the binary alone
  # checks the pages that it changed, and the pages that wait for a minute are
  # checked when the change is about what they show.
  docs:
    name: docs (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.binary == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.changes.outputs.limit) }}
    env:
      CI_EVENT: ${{ github.event_name }}
      CI_BINARY: ${{ needs.changes.outputs.binary }}
      CI_SLOW: ${{ needs.changes.outputs.slow }}
      SHARD: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "concepts, specification and policies", shard: concepts}
          - {name: "how-to", shard: how-to}
          - {name: "learn: pravo", shard: learn}
          - {name: "reference: commands", shard: commands}
          - {name: "pages that wait a minute", shard: slow}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: pages
        run: |
          if [ -n "$(sh tools/ci/pages.sh "$SHARD")" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "No page of this job needs checking."
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pages.outputs.any == 'true'
        uses: ./.github/actions/go
        with:
          key: capture
      - if: steps.pages.outputs.any == 'true'
        name: Cache the providers that the pages download
        uses: actions/cache@v6
        with:
          path: ~/.pravo
          key: pravo-home-${{ runner.os }}-docs-${{ matrix.shard }}-${{ hashFiles('docs/**/*.md') }}
          restore-keys: pravo-home-${{ runner.os }}-docs-${{ matrix.shard }}-
      - if: steps.pages.outputs.any == 'true'
        name: Cache cue
        id: cue
        uses: actions/cache@v6
        with:
          path: ~/go/bin/cue
          key: cue-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
      - if: steps.pages.outputs.any == 'true' && steps.cue.outputs.cache-hit != 'true'
        name: Install cue at the version that pravo embeds
        run: go install cuelang.org/go/cmd/cue@$(go list -m -f '{{.Version}}' cuelang.org/go)
      - if: steps.pages.outputs.any == 'true'
        name: Build pravo
        run: go build -o bin/pravo ./cmd/pravo
      - if: steps.pages.outputs.any == 'true'
        name: Check the pages
        run: go run ./tools/capture -check -j 4 -bin bin/pravo $(sh tools/ci/pages.sh "$SHARD")
      - if: ${{ !cancelled() && steps.pages.outputs.any == 'true' }}
        uses: ./.github/actions/go-save
        with:
          key: capture

  # The recorded scenarios behind the landing page and the demos. They run
  # OpenTofu next to pravo.
  demos:
    name: demos (hero, idea, blast and migration)
    needs: changes
    if: needs.changes.outputs.binary == 'true' || needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.changes.outputs.limit) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: capture
      - uses: ./.github/actions/tofu
        timeout-minutes: 3
        with:
          version: ${{ env.TOFU_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.pravo
          key: pravo-home-${{ runner.os }}-demos-${{ hashFiles('site/demos/**/page.md') }}
          restore-keys: pravo-home-${{ runner.os }}-demos-
      - run: go build -o bin/pravo ./cmd/pravo
      - run: go run ./tools/capture -check -j 2 -bin bin/pravo site/demos/hero site/demos/idea site/demos/facts site/demos/blast site/demos/migrate
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: capture

  # The scenario with two thousand resources, which pravo and OpenTofu each apply
  # and plan again. It takes a minute by itself, so a pull request runs it when it
  # changes the engine, the state or the plugins, or the scenario.
  scale:
    name: demos (scale)
    needs: changes
    if: needs.changes.outputs.slow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.changes.outputs.limit) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: capture
      - uses: ./.github/actions/tofu
        timeout-minutes: 3
        with:
          version: ${{ env.TOFU_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.pravo
          key: pravo-home-${{ runner.os }}-demos-scale-${{ hashFiles('site/demos/scale/page.md') }}
          restore-keys: pravo-home-${{ runner.os }}-demos-scale-
      - run: go build -o bin/pravo ./cmd/pravo
      - run: go run ./tools/capture -check -j 2 -bin bin/pravo site/demos/scale
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: capture

  # The OpenTofu listings of the documentation are valid, and the statements
  # about OpenTofu that the pages make still hold.
  opentofu:
    needs: changes
    if: needs.changes.outputs.hcl == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.changes.outputs.limit) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: hclcheck
      - uses: ./.github/actions/tofu
        timeout-minutes: 3
        with:
          version: ${{ env.TOFU_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/hclcheck-plugins
          key: hclcheck-plugins-${{ hashFiles('docs/**/*.md', 'site/demos/**/page.md') }}
          restore-keys: hclcheck-plugins-
      - run: go run ./tools/hclcheck -j 4 -cache ~/hclcheck-plugins
      - run: sh tools/hclcheck/claims.sh
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: hclcheck

  # The site builds, the phrase lint passes, every link resolves and the facts
  # on the landing page are the ones that the sources give.
  site:
    needs: changes
    if: needs.changes.outputs.binary == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.changes.outputs.limit) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: site
      - run: go build -o bin/pravo ./cmd/pravo
      - run: go run ./tools/sitegen -pravo-bin bin/pravo
      - run: go run site/demos/facts/facts.go -check
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: site

  # One check to require in the branch protection settings.
  ci:
    if: always()
    needs: [changes, static, lint, lint-web, test, other-systems, macos, tools, docs, demos, scale, opentofu, site]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
