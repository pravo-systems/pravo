name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the same checks before it builds anything.
  workflow_call:

# A new push to a branch cancels the run that is still going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  # The version of OpenTofu that the documentation was written against.
  TOFU_VERSION: 1.13.1

jobs:
  # Formatting, vet, module hygiene, and a build for every platform that pravo
  # supports. The slow jobs below do not wait for this one: they all start at once.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: static
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go vet for Windows
        run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: go mod tidy changes nothing
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Build for every platform
        run: |
          # All six at once: they share the module cache and compile different files.
          pids=""
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            (GOOS=${target%/*} GOARCH=${target#*/} go build ./... && echo "built $target") &
            pids="$pids $!"
          done
          status=0
          for pid in $pids; do wait "$pid" || status=1; done
          exit $status
      - uses: ./.github/actions/go-save
        with:
          key: static

  # golangci-lint (.golangci.yml) on the files of each platform that pravo
  # supports, next to the other jobs and waited for by none of them. The binary,
  # its analysis cache and the build cache are kept between runs, so a run takes
  # about a minute once they are warm.
  lint:
    name: lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
    env:
      # The first release that was built with the Go version of go.mod. Change it
      # together with the line `go` of go.mod when that moves on.
      GOLANGCI_LINT_VERSION: v2.15.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache golangci-lint
        id: binary
        uses: actions/cache@v6
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('go.mod') }}
      - name: Install golangci-lint
        if: steps.binary.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - name: Cache the analysis
        uses: actions/cache@v6
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-cache-${{ matrix.goos }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: golangci-lint-cache-${{ matrix.goos }}-${{ hashFiles('go.sum', '.golangci.yml') }}-
      - name: golangci-lint
        run: GOOS=${{ matrix.goos }} ~/go/bin/golangci-lint run ./...

  # ESLint and Stylelint (tools/_weblint) on the viewer and on the site.
  lint-web:
    name: lint (viewer and site)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/_weblint/package-lock.json
      - run: npm --prefix tools/_weblint ci
      - run: npm --prefix tools/_weblint run lint

  # The Go tests, split by package so that the long ones run side by side. On a
  # pull request the stress tests of the engine run with -short, which keeps
  # their shapes and cuts the number of trials; main and the release run them in full.
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SHORT: ${{ github.event_name == 'pull_request' && '-short' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: engine, race
            os: ubuntu-latest
            run: go test -race -count=1 $SHORT ./internal/engine
          - name: state, race
            os: ubuntu-latest
            run: go test -race -count=1 ./internal/state/...
          - name: cmd
            os: ubuntu-latest
            run: go test -count=1 ./cmd/...
          - name: other packages
            os: ubuntu-latest
            run: go test -count=1 $(go list ./... | grep -v -E '/(internal/engine|internal/state|cmd|tools)(/|$)')
          - name: state and cmd on macOS
            os: macos-latest
            run: go test -count=1 ./internal/state/... ./cmd/...
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: test
      # The engine tests sync many small files. Other packages compare paths
      # under the temporary directory and expect the usual one.
      - name: Temporary files of the engine tests in memory
        if: matrix.name == 'engine, race'
        run: echo "TMPDIR=/dev/shm" >> "$GITHUB_ENV"
      - run: ${{ matrix.run }}
      - uses: ./.github/actions/go-save
        with:
          key: test

  # The Go tests on Windows, where file operations are slow: the engine tests
  # are dealt out to four jobs and everything else to two. Like the Linux tests,
  # they run with -short on a pull request. The build and
  # vet for Windows are in the static job. The documentation tools run a POSIX
  # shell and are not part of this.
  windows:
    name: windows (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SHORT: ${{ github.event_name == 'pull_request' && '-short' || '' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "engine 1/4", run: "sh tools/ci/test-shard.sh ./internal/engine 0 4 -v -timeout 25m $SHORT"}
          - {name: "engine 2/4", run: "sh tools/ci/test-shard.sh ./internal/engine 1 4 -v -timeout 25m $SHORT"}
          - {name: "engine 3/4", run: "sh tools/ci/test-shard.sh ./internal/engine 2 4 -v -timeout 25m $SHORT"}
          - {name: "engine 4/4", run: "sh tools/ci/test-shard.sh ./internal/engine 3 4 -v -timeout 25m $SHORT"}
          - {name: "other packages 1/2", run: "go test -count=1 -timeout 25m $SHORT $(go list ./internal/... ./cmd/... | grep -v '/internal/engine$' | awk 'NR%2==0')"}
          - {name: "other packages 2/2", run: "go test -count=1 -timeout 25m $SHORT $(go list ./internal/... ./cmd/... | grep -v '/internal/engine$' | awk 'NR%2==1')"}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: windows
      - run: ${{ matrix.run }}
      - uses: ./.github/actions/go-save
        with:
          key: windows

  # The tools of the documentation: capture, sitegen, hclcheck and the scale
  # benchmark. Their tests start the binary and some of them run tofu.
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: tools
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: go test -count=1 ./tools/...
      - uses: ./.github/actions/go-save
        with:
          key: tools

  # Every command of every page of the documentation runs against the real
  # binary, and its output is compared with the page. One job for each section.
  docs:
    name: docs (${{ matrix.section }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        section: [concepts, how-to, learn, migrate, reference]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: tools
      - name: Cache the providers that the pages download
        uses: actions/cache@v6
        with:
          path: ~/.pravo
          key: pravo-home-${{ runner.os }}-${{ matrix.section }}-${{ hashFiles('docs/**/*.md') }}
          restore-keys: pravo-home-${{ runner.os }}-${{ matrix.section }}-
      - name: Install cue at the version that pravo embeds
        run: go install cuelang.org/go/cmd/cue@$(go list -m -f '{{.Version}}' cuelang.org/go)
      - name: Build pravo
        run: go build -o bin/pravo ./cmd/pravo
      - name: Check the pages
        run: go run ./tools/capture -check -j 4 -bin bin/pravo ./docs/${{ matrix.section }}
      - uses: ./.github/actions/go-save
        with:
          key: tools

  # The recorded scenarios behind the landing page and the demos. They run
  # OpenTofu next to pravo.
  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: tools
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: actions/cache@v6
        with:
          path: ~/.pravo
          key: pravo-home-${{ runner.os }}-demos-${{ hashFiles('site/demos/**/page.md') }}
          restore-keys: pravo-home-${{ runner.os }}-demos-
      - run: go build -o bin/pravo ./cmd/pravo
      - run: go run ./tools/capture -check -j 2 -bin bin/pravo site/demos
      - uses: ./.github/actions/go-save
        with:
          key: tools

  # The OpenTofu listings of the documentation are valid, and the statements
  # about OpenTofu that the pages make still hold.
  opentofu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: tools
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: actions/cache@v6
        with:
          path: ~/hclcheck-plugins
          key: hclcheck-plugins-${{ hashFiles('docs/**/*.md', 'site/demos/**/page.md') }}
          restore-keys: hclcheck-plugins-
      - run: go run ./tools/hclcheck -j 4 -cache ~/hclcheck-plugins
      - run: sh tools/hclcheck/claims.sh
      - uses: ./.github/actions/go-save
        with:
          key: tools

  # The site builds, the phrase lint passes, every link resolves and the facts
  # on the landing page are the ones that the sources give.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: tools
      - run: go build -o bin/pravo ./cmd/pravo
      - run: go run ./tools/sitegen -pravo-bin bin/pravo
      - run: go run site/demos/facts/facts.go -check
      - uses: ./.github/actions/go-save
        with:
          key: tools

  # One check to require in the branch protection settings.
  ci:
    if: always()
    needs: [static, lint, lint-web, test, windows, tools, docs, demos, opentofu, site]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
