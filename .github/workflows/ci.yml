name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the same checks before it builds anything.
  workflow_call:

# A new push to a branch cancels the run that is still going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  # The version of OpenTofu that the documentation was written against.
  TOFU_VERSION: 1.13.1

jobs:
  # A pull request run that is not finished three minutes after it started is
  # cancelled: a job that hangs or a cache that is cold should not hold the author
  # for forty minutes. It leaves as soon as the ci job below is done. A change
  # that also runs the Windows and macOS tests, or the whole of CI, gets seven
  # minutes. It cannot cancel a run of a fork, whose token may not write.
  watchdog:
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Seconds a pull request run may take, from the end of the changes job.
      LIMIT: ${{ (needs.changes.outputs.all == 'true' || needs.changes.outputs.platform == 'true') && 420 || 170 }}
    steps:
      - run: |
          jobs="repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100"
          end=$(( $(date +%s) + LIMIT - 10 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            [ "$(gh api "$jobs" --jq '[.jobs[] | select(.name == "ci") | .status] | first')" = completed ] && exit 0
            sleep 2
          done
          echo "The run took longer than ${LIMIT} s: cancelling it"
          gh run cancel ${{ github.run_id }} --repo ${{ github.repository }} || true

  # Which parts of the repository a pull request touches (tools/ci/changes.sh).
  # The jobs that it cannot affect are skipped; main, tags and the workflows
  # themselves run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      all: ${{ steps.c.outputs.all }}
      code: ${{ steps.c.outputs.code }}
      binary: ${{ steps.c.outputs.binary }}
      docs: ${{ steps.c.outputs.docs }}
      site: ${{ steps.c.outputs.site }}
      web: ${{ steps.c.outputs.web }}
      hcl: ${{ steps.c.outputs.hcl }}
      platform: ${{ steps.c.outputs.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: c
        env:
          CI_EVENT: ${{ github.event_name }}
        run: sh tools/ci/changes.sh

  # Formatting, vet, module hygiene, and a build for every platform that pravo
  # supports. The slow jobs below do not wait for this one: they all start at once.
  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: static
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go vet for Windows
        run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: go mod tidy changes nothing
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Build for every platform
        run: |
          # All six at once: they share the module cache and compile different files.
          pids=""
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            (GOOS=${target%/*} GOARCH=${target#*/} go build ./... && echo "built $target") &
            pids="$pids $!"
          done
          status=0
          for pid in $pids; do wait "$pid" || status=1; done
          exit $status
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: static

  # golangci-lint (.golangci.yml) on the files of each platform that pravo
  # supports, next to the other jobs and waited for by none of them. The binary,
  # its analysis cache and the build cache are kept between runs, so a run takes
  # about a minute once they are warm.
  lint:
    name: lint (${{ matrix.goos }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The files of the other systems are linted when a change touches them.
        goos: ${{ fromJSON(needs.changes.outputs.platform == 'true' && '["linux","windows","darwin"]' || '["linux"]') }}
    env:
      # The first release that was built with the Go version of go.mod. Change it
      # together with the line `go` of go.mod when that moves on.
      GOLANGCI_LINT_VERSION: v2.15.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/go
        with:
          key: lint-${{ matrix.goos }}
      - name: Cache golangci-lint
        id: binary
        uses: actions/cache@v6
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('go.mod') }}
      - name: Install golangci-lint
        if: steps.binary.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - name: Cache the analysis
        uses: actions/cache@v6
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-cache-${{ matrix.goos }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: golangci-lint-cache-${{ matrix.goos }}-${{ hashFiles('go.sum', '.golangci.yml') }}-
      - name: golangci-lint
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_ALL: ${{ needs.changes.outputs.all }}
        run: GOOS=${{ matrix.goos }} sh tools/ci/lint.sh ~/go/bin/golangci-lint
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: lint-${{ matrix.goos }}

  # ESLint and Stylelint (tools/_weblint) on the viewer and on the site.
  lint-web:
    name: lint (viewer and site)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/_weblint/package-lock.json
      - run: npm --prefix tools/_weblint ci
      - run: npm --prefix tools/_weblint run lint

  # The Go tests on Linux, split so that the long ones run side by side. A pull
  # request runs only the packages that its change can reach through imports
  # (tools/ci/gotest.sh), without the race detector, and the engine stress tests
  # with -short, which keeps their shapes and cuts the number of trials. Main and
  # the release run all of it, with -race.
  test:
    name: test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_EVENT: ${{ github.event_name }}
      CI_ALL: ${{ needs.changes.outputs.all }}
      SHORT: ${{ github.event_name == 'pull_request' && '-short' || '' }}
      RACE: ${{ github.event_name == 'pull_request' && ' ' || '-race' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "engine: locks, applies and equivalence", run: "sh tools/ci/gotest.sh engine in 'applylocks_test.go interrupt_test.go apply_scope_test.go equivalence_test.go' $RACE $SHORT", tmp: shm}
          - {name: "engine: plans and discovery", run: "sh tools/ci/gotest.sh engine out 'applylocks_test.go interrupt_test.go apply_scope_test.go equivalence_test.go' $RACE $SHORT", tmp: shm}
          - {name: "state", run: "sh tools/ci/gotest.sh state $RACE"}
          - {name: "cmd: keys, roles and sealing", run: "sh tools/ci/gotest.sh cmd in 'protect_test.go protect_sealed_test.go roles_chain_test.go roles_test.go id_test.go identity_test.go downgrade_test.go recovery_test.go'"}
          - {name: "cmd: plans and commands", run: "sh tools/ci/gotest.sh cmd out 'protect_test.go protect_sealed_test.go roles_chain_test.go roles_test.go id_test.go identity_test.go downgrade_test.go recovery_test.go'"}
          - {name: "serve: access and security", run: "sh tools/ci/gotest.sh serve in 'access_test.go security_test.go redact_test.go'"}
          - {name: "serve: viewer", run: "sh tools/ci/gotest.sh serve out 'access_test.go security_test.go redact_test.go'"}
          - {name: "other packages", run: "sh tools/ci/gotest.sh other"}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/go
        with:
          key: test
      # The engine tests sync many small files. Other packages compare paths
      # under the temporary directory and expect the usual one.
      - name: Temporary files of the engine tests in memory
        if: matrix.tmp == 'shm'
        run: echo "TMPDIR=/dev/shm" >> "$GITHUB_ENV"
      - run: ${{ matrix.run }}
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: test

  # The same tests on Windows, where file operations and locks behave differently
  # and the runners are slow. A pull request runs them when it changes a file for
  # one system or a package that works with files, locks or processes; main and
  # the release run them always. The build, vet and lint for Windows and macOS
  # are in the jobs above and run every time. The documentation tools run a POSIX
  # shell and are not part of this.
  other-systems:
    name: windows (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.platform == 'true')
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI_EVENT: ${{ github.event_name }}
      CI_ALL: ${{ needs.changes.outputs.all }}
      SHORT: ${{ github.event_name == 'pull_request' && '-short' || '' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "engine: locks and applies", run: "sh tools/ci/gotest.sh engine in 'applylocks_test.go interrupt_test.go apply_scope_test.go' -v -timeout 25m $SHORT"}
          - {name: "engine: equivalence", run: "sh tools/ci/gotest.sh engine in 'equivalence_test.go' -v -timeout 25m $SHORT"}
          - {name: "engine: plans and discovery", run: "sh tools/ci/gotest.sh engine out 'applylocks_test.go interrupt_test.go apply_scope_test.go equivalence_test.go' -v -timeout 25m $SHORT"}
          - {name: "commands and viewer", run: "sh tools/ci/gotest.sh commands -timeout 25m $SHORT"}
          - {name: "state and libraries", run: "sh tools/ci/gotest.sh libraries -timeout 25m $SHORT"}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/go
        with:
          key: tests
      - run: ${{ matrix.run }}
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: tests

  # The tests of the packages that work with files and locks, on macOS. The
  # runners are scarce: a job has waited five minutes for one. Only main and the
  # release run it.
  macos:
    name: macos (state and cmd)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CI_EVENT: ${{ github.event_name }}
      CI_ALL: ${{ needs.changes.outputs.all }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: tests
      - run: sh tools/ci/gotest.sh state && sh tools/ci/gotest.sh cmd
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: tests

  # The tools of the documentation: capture, sitegen, hclcheck and the scale
  # benchmark. Their tests start the binary and some of them run tofu.
  tools:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: tools
      - uses: ./.github/actions/tofu
        timeout-minutes: 3
        with:
          version: ${{ env.TOFU_VERSION }}
      - run: go test -count=1 ./tools/...
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: tools

  # Every command of every page of the documentation runs against the real
  # binary, and its output is compared with the page. The pages are dealt out to
  # jobs by section.
  docs:
    name: docs (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.binary == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "concepts and migration", pages: "ls docs/concepts/*.md docs/migrate/*.md"}
          - {name: "how-to", pages: "ls docs/how-to/*.md"}
          - {name: "learn: CUE", pages: "ls docs/learn/a*.md docs/learn/cue*.md"}
          - {name: "learn: pravo", pages: "ls docs/learn/b*.md docs/learn/c[0-9]*.md docs/learn/lab*.md docs/learn/index.md"}
          - {name: "reference: the specification", pages: "ls docs/reference/spec-*.md"}
          - {name: "reference: policies", pages: "ls docs/reference/policies-*.md docs/reference/policy.md"}
          - {name: "reference: commands and state", pages: "find docs/reference -name '*.md' ! -name 'spec-*' ! -name 'policies-*' ! -name policy.md"}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: tools
      - name: Cache the providers that the pages download
        uses: actions/cache@v6
        with:
          path: ~/.pravo
          key: pravo-home-${{ runner.os }}-docs-${{ matrix.name }}-${{ hashFiles('docs/**/*.md') }}
          restore-keys: pravo-home-${{ runner.os }}-docs-${{ matrix.name }}-
      - name: Install cue at the version that pravo embeds
        run: go install cuelang.org/go/cmd/cue@$(go list -m -f '{{.Version}}' cuelang.org/go)
      - name: Build pravo
        run: go build -o bin/pravo ./cmd/pravo
      - name: Check the pages
        run: go run ./tools/capture -check -j 4 -bin bin/pravo $(${{ matrix.pages }} | sort)
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: tools

  # The recorded scenarios behind the landing page and the demos. They run
  # OpenTofu next to pravo.
  demos:
    name: demos (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.binary == 'true' || needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "hero and idea", pages: "site/demos/hero site/demos/idea site/demos/facts"}
          - {name: "blast and migration", pages: "site/demos/blast site/demos/migrate"}
          - {name: "scale", pages: "site/demos/scale"}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: tools
      - uses: ./.github/actions/tofu
        timeout-minutes: 3
        with:
          version: ${{ env.TOFU_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.pravo
          key: pravo-home-${{ runner.os }}-demos-${{ matrix.name }}-${{ hashFiles('site/demos/**/page.md') }}
          restore-keys: pravo-home-${{ runner.os }}-demos-${{ matrix.name }}-
      - run: go build -o bin/pravo ./cmd/pravo
      - run: go run ./tools/capture -check -j 2 -bin bin/pravo ${{ matrix.pages }}
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: tools

  # The OpenTofu listings of the documentation are valid, and the statements
  # about OpenTofu that the pages make still hold.
  opentofu:
    needs: changes
    if: needs.changes.outputs.hcl == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: tools
      - uses: ./.github/actions/tofu
        timeout-minutes: 3
        with:
          version: ${{ env.TOFU_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/hclcheck-plugins
          key: hclcheck-plugins-${{ hashFiles('docs/**/*.md', 'site/demos/**/page.md') }}
          restore-keys: hclcheck-plugins-
      - run: go run ./tools/hclcheck -j 4 -cache ~/hclcheck-plugins
      - run: sh tools/hclcheck/claims.sh
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: tools

  # The site builds, the phrase lint passes, every link resolves and the facts
  # on the landing page are the ones that the sources give.
  site:
    needs: changes
    if: needs.changes.outputs.binary == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        with:
          key: tools
      - run: go build -o bin/pravo ./cmd/pravo
      - run: go run ./tools/sitegen -pravo-bin bin/pravo
      - run: go run site/demos/facts/facts.go -check
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-save
        with:
          key: tools

  # One check to require in the branch protection settings.
  ci:
    if: always()
    needs: [changes, static, lint, lint-web, test, other-systems, macos, tools, docs, demos, opentofu, site]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
